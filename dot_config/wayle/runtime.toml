[general]
font-sans = "IBM Plex Sans JP"

[bar]
scale = 0.800000011920929
button-variant = "basic"
button-opacity = 95
button-bg-opacity = 95
dropdown-opacity = 95

[[bar.layout]]
monitor = "*"
show = true
left = [
    "dashboard",
    "hyprland-workspaces",
    "media",
]
center = ["clock"]
right = [
    "systray",
    "battery",
    "network",
    "bluetooth",
    "microphone",
    "volume",
    "brightness",
    "idle-inhibit",
    "notifications",
]

[styling]
rounding = "none"

[styling.palette]
bg = "#000000"
surface = "#1e1e1e"
elevated = "#303030"
fg = "#ffffff"
fg-muted = "#989898"
primary = "#2fafff"
red = "#ff5f59"
yellow = "#d0bc00"
green = "#44bc44"
blue = "#2fafff"

[modules.bluetooth]
label-show = false

[modules.clock]
format = "%m月%d日 (%a) %H:%M"

[modules.microphone]
label-show = false

[modules.network]
label-show = false

[modules.weather]
location = "Tokyo"

[wallpaper]
engine-enabled = false
