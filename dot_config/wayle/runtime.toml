[general]
font-sans = "IBM Plex Sans JP"

[bar]
scale = 0.800000011920929
background-opacity = 95
button-variant = "basic"
button-opacity = 95
button-bg-opacity = 95
dropdown-opacity = 95

[[bar.layout]]
monitor = "*"
show = true
left = [
    "dashboard",
    "hyprland-workspaces",
    "media",
]
center = ["clock"]
right = [
    "systray",
    "battery",
    "network",
    "bluetooth",
    "microphone",
    "volume",
    "brightness",
    "idle-inhibit",
    "notifications",
]

[styling]
rounding = "none"

[styling.palette]
bg = "#11111b"
surface = "#181825"
elevated = "#1e1e2e"
fg = "#cdd6f4"
fg-muted = "#bac2de"
primary = "#b4befe"
red = "#f38ba8"
yellow = "#f9e2af"
green = "#a6e3a1"
blue = "#74c7ec"

[modules.bluetooth]
label-show = false

[modules.clock]
format = "%m月%d日 (%a) %H:%M"

[modules.microphone]
label-show = false

[modules.network]
label-show = false

[wallpaper]
engine-enabled = false
