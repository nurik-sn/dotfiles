bindsym $mod+n exec nautilus
bindsym $mod+c exec cliphist list | rofi -dmenu | cliphist decode | wl-copy
bindsym $mod+Ctrl+l exec loginctl lock-session
bindsym $mod+Escape exec wlogout -b 2
bindsym $mod+Shift+s exec mkdir -p ~/Pictures/Screenshots && grim -g "$(slurp)" - | tee ~/Pictures/Screenshots/$(date +%Y%m%d_%H%M%S).png | wl-copy --type image/png

# 音量・輝度キーを OSD 付きに置き換え（標準の設定を上書き）
bindsym --locked --no-warn XF86AudioRaiseVolume exec swayosd-client --output-volume raise
bindsym --locked --no-warn XF86AudioLowerVolume exec swayosd-client --output-volume lower
bindsym --locked --no-warn XF86AudioMute exec swayosd-client --output-volume mute-toggle
bindsym --locked --no-warn XF86AudioMicMute exec swayosd-client --input-volume mute-toggle
bindsym --locked --no-warn XF86MonBrightnessUp exec swayosd-client --brightness raise
bindsym --locked --no-warn XF86MonBrightnessDown exec swayosd-client --brightness lower
bindsym $mod+Shift+n exec swaync-client -t -sw
