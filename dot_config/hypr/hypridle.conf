general {
    lock_cmd = pidof hyprlock || hyprlock       # 外部からのロック要求で実行
    before_sleep_cmd = loginctl lock-session    # サスペンド直前にロック
    after_sleep_cmd = hyprctl dispatch dpms on  # 復帰時に画面点灯
}

# 5分無操作: 画面ロック
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 5.5分無操作: ディスプレイ消灯 (DPMS)
listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}