format = """
$os$username$hostname$directory$git_branch$git_status$nix_shell$package$all$cmd_duration
$character"""

palette = "catppuccin_mocha"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo  = "#f2cdcd"
pink      = "#f5c2e7"
mauve     = "#cba6f7"
red       = "#f38ba8"
maroon    = "#eba0ac"
peach     = "#fab387"
yellow    = "#f9e2af"
green     = "#a6e3a1"
teal      = "#94e2d5"
sky       = "#89dceb"
sapphire  = "#74c7ec"
blue      = "#89b4fa"
lavender  = "#b4befe"
text      = "#cdd6f4"
subtext1  = "#bac2de"
subtext0  = "#a6adc8"
overlay2  = "#9399b2"
overlay1  = "#7f849c"
overlay0  = "#6c7086"
surface2  = "#585b70"
surface1  = "#45475a"
surface0  = "#313244"
base      = "#1e1e2e"
mantle    = "#181825"
crust     = "#11111b"


[os]
disabled = false
style = "bg:blue fg:crust"
format = "[](fg:blue)[$symbol]($style)"

[os.symbols]
Linux = " "
Arch  = "\uf303 "

[username]
show_always = true
style_user = "bg:blue fg:crust bold"
style_root = "bg:red fg:crust bold"
format = "[$user]($style)"

[hostname]
ssh_only = false
style = "bg:blue fg:crust bold"
format = "[@$hostname]($style)[](fg:blue) "

[directory]
style = "bg:surface0 fg:sapphire bold"
format = "[](fg:surface0)[ $path]($style)[](fg:surface0) "
truncation_length = 4
truncation_symbol = "…/"

[directory.substitutions]
"/" = " \u001b[38;2;203;166;247m❯\u001b[38;2;116;199;236m "
"~" = "\u001b[38;2;250;179;135m~\u001b[38;2;116;199;236m"

[git_branch]
symbol = " "
style = "bg:surface1 fg:mauve bold"
format = "[](fg:surface1)[$symbol$branch]($style)"

[git_status]
style = "bg:surface1 fg:peach bold"
format = "[[ $all_status$ahead_behind]($style)](bg:surface1)[](fg:surface1) "

conflicted = "🏳"
ahead = "⇡"
behind = "⇣"
diverged = "⇕"
untracked = "?"
stashed = "📦"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"

